name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Ye-Shaiyoe

          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

            dist/github-snake.svg?color_snake=cba6f7&color_dots=#1e1e2e,#313244,#45475a,#585b70,#89b4fa
              
            dist/github-snake-rainbow.svg?palette=github-dark&color_snake=ff79c6

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
